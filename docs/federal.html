      <a class="brand" href="index.html">
        <img class="brand-mark" src="favicon.svg" alt="" width="28" height="28">
        <span class="site-name" data-site-name>TheGovWatcher</span>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>

  <main id="main" class="shell" tabindex="-1">
    <noscript><p class="empty">JavaScript is required to load this feed.</p></noscript>
    <header class="page-head">
      <p class="eyebrow"><span class="dot" aria-hidden="true"></span> Official actions</p>
      <h1>Federal government actions</h1>
      <p class="lead">Bills, votes, executive orders, and Federal Register items from official sources.</p>
      <p id="updated" class="note">Loading…</p>
    </header>
    <form id="filters" class="filters" role="search" aria-label="Filter federal actions">
      <p class="filters-heading">Filters</p>
      <label>
        Search
        <input id="q" type="search" name="q" placeholder="Title, identifier, source" autocomplete="off">
      </label>
      <label>
        Type
        <select id="kind" name="kind">
          <option value="">All types</option>
          <option value="bill">Bills</option>
          <option value="vote">Votes</option>
          <option value="executive_order">Executive orders</option>
          <option value="federal_register">Federal Register</option>
        </select>
      </label>
      <p id="result-count" class="result-count"></p>
    </form>
    <div id="feed" aria-live="polite"></div>
  </main>
  <footer class="site-footer">
    <div class="shell">
      <p>Official public records only. Not affiliated with the U.S. government.</p>
    </div>
  </footer>
