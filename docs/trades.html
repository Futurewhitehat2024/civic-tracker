<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b14">
  <title>Trades</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-page-title="Congressional trades">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell bar">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="favicon.svg" alt="" width="28" height="28">
        <span class="site-name" data-site-name>TheGovWatcher</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="label-closed">Menu</span>
        <span class="label-open">Close</span>
      </button>
      <nav id="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="federal.html">Federal</a>
        <a href="trades.html" aria-current="page">Trades</a>
        <a href="status.html">Status</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <noscript><p class="empty">JavaScript is required to load this feed.</p></noscript>
    <header class="page-head">
      <p class="eyebrow"><span class="dot" aria-hidden="true"></span> STOCK Act filings</p>
      <h1>Congressional trades</h1>
      <p class="lead">STOCK Act periodic transaction reports, written as short items with a link to the official filing.</p>
      <p id="updated" class="note">Loading…</p>
    </header>
    <form id="filters" class="filters wide" role="search" aria-label="Filter congressional trades">
      <p class="filters-heading">Filters</p>
      <label>
        Member
        <input id="member" type="search" name="member" placeholder="Name" autocomplete="off">
      </label>
      <label>
        Chamber
        <select id="chamber" name="chamber">
          <option value="">Both chambers</option>
          <option value="house">House</option>
          <option value="senate">Senate</option>
        </select>
      </label>
      <label>
        Party
        <select id="party" name="party">
          <option value="">Any party</option>
          <option value="Democratic">Democratic</option>
          <option value="Republican">Republican</option>
          <option value="Independent">Independent</option>
        </select>
      </label>
      <label>
        From
        <input id="from" type="date" name="from">
      </label>
      <label>
        To
        <input id="to" type="date" name="to">
      </label>
      <p id="result-count" class="result-count"></p>
    </form>
    <div id="feed" aria-live="polite"></div>
  </main>
  <footer class="site-footer">
    <div class="shell">
      <p>Disclosures, not accusations. Official filings are the record.</p>
    </div>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
